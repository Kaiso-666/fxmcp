<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>fxmcp bridge</title>
    <style>
      :root { color-scheme: dark light; }
      body { font: 13px/1.5 "Segoe UI", system-ui, sans-serif; margin: 20px; max-width: 540px; background: #14161a; color: #d7dbe0; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.sub { margin: 0 0 18px; color: #8b949e; font-size: 12px; }
      label { display: block; font-size: 12px; color: #8b949e; margin: 0 0 5px; }
      input { width: 100%; box-sizing: border-box; padding: 7px 9px; background: #1c2027; color: #e6edf3; border: 1px solid #2b313a; border-radius: 5px; font: inherit; }
      .row { margin: 0 0 14px; }
      button { padding: 8px 16px; background: #2f6feb; border: 0; border-radius: 5px; color: #fff; font: inherit; cursor: pointer; }
      button:hover { background: #3b7ef7; }
      #msg { margin-top: 12px; min-height: 1.2em; color: #56d364; font-size: 12px; }
      code { background: #1c2027; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
      .hint { color: #8b949e; font-size: 12px; margin-top: 18px; }
    </style>
  </head>
  <body>
    <h1>fxmcp bridge</h1>
    <p class="sub">Connection settings for the local MCP server. Saved in this add-on's storage.</p>

    <div class="row">
      <label for="endpoint">WebSocket endpoint</label>
      <input id="endpoint" placeholder="ws://127.0.0.1:8787" />
    </div>

    <div class="row">
      <label for="token">Bridge token</label>
      <input id="token" placeholder="contents of ~/.fxmcp/token" autocomplete="off" spellcheck="false" />
    </div>

    <div class="row">
      <label for="pool">Worker tabs (1-8)</label>
      <input id="pool" type="number" min="1" max="8" step="1" />
    </div>

    <button id="save">Save &amp; reconnect</button>
    <div id="msg"></div>

    <p class="hint">
      Token lives in <code>~/.fxmcp/token</code>; regenerate it together with the server using
      <code>npm run init</code> and paste the new value here. Changing anything here reconnects the
      bridge immediately — no reinstall, no rebuild.
    </p>

    <script type="module" src="options.js"></script>
  </body>
</html>
